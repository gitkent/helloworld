language: node_js
node_js:
  - "stable"
service:
  - docker
before_install:
  - npm install mocha
jobs:
  include:
    - stage: test
      script: npm test
    - stage: build
      script: docker build -t "$DOCKER_USER"/"$DOCKER_REPO" .
      if: branch = master
    - stage: publish
      script: bash docker_push
      if: branch = master
after_install:
  - npm stop
stages:
  - test
  - build
  - publish
