language: node_js
node_js:
  - "stable"
service:
  - docker
jobs:
  include:
    - stage: test
      before_install:
        - npm install mocha
      script: npm test
    - stage: build_preview
      script: skip
      deploy:
        provider: script
        script: bash docker_push preview
    - stage: test_preview
      script: docker run --rm $DOCKER_USER/$DOCKER_REPO:preview node -v
    - stage: publish
      script: skip
      deploy:
        provider: script
        script: bash docker_push latest
stages:
  - test
  - name: build_preview
    if: branch = master
  - name: test_preview
    if: branch = master
  - name: publish
    if: (NOT type IN (pull_request)) AND (branch = master)
